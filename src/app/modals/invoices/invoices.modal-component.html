<kirby-page-title>Create Invoices</kirby-page-title>

@if (vm.invoices().length > 0) {
<atlas-invoice-table
    [invoices]="vm.invoices()"
    (invoiceSelected)="vm.view($event)"
></atlas-invoice-table>
} @else if (vm.state() === 'idle') {
<kirby-empty-state
    iconName="help"
    title="Idle"
    subtitle="The workflow hasn't reached this step yet"
></kirby-empty-state>
} @else {
<kirby-empty-state
    iconName="verify"
    themeColor="success"
    title="Success"
    subtitle="No billing documents to create"
></kirby-empty-state>
}

<kirby-modal-footer>
    <button kirby-button type="submit" (click)="vm.create()">Create</button>
</kirby-modal-footer>
